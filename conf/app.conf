appname = el_fogon_de_maria
httpport = 8080
runmode = dev

# Otras configuraciones
copyrequestbody = true
swagger = true

# Configración de la base de datos - usa variables de entorno
# Para desarrollo local, configura DB_HOST, DB_PORT, DB_USER, DB_PASS, DB_NAME
db_host = ${DB_HOST||localhost}
db_port = ${DB_PORT||5432}
db_user = ${DB_USER||postgres}
db_pass = ${DB_PASS||12346}
db_name = ${DB_NAME||restaurante_db}

# Firebase
firebase_project_id = el-fogon-de-maria

# VAPID (Web Push Notifications) - usa variables de entorno OBLIGATORIAS
# Configura: VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT
# Para generar claves: https://web-push-codelab.glitch.me/ o npm install -g web-push && web-push generate-vapid-keys
vapid_public_key = ${VAPID_PUBLIC_KEY}
vapid_private_key = ${VAPID_PRIVATE_KEY}
vapid_subject = ${VAPID_SUBJECT}
