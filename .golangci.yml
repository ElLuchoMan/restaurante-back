run:
  timeout: 5m
  tests: false

linters:
  disable-all: true
  enable:
    - errcheck
    - ineffassign
  fast: true

issues:
  exclude-dirs:
    - docs
    - swagger
  exclude-rules:
    # Relajar en archivos de test para evitar falso-positivos en mocks y helpers
    - path: ".*_test\\.go"
      linters:
        - errcheck
        - ineffassign
        - staticcheck
        - unused
    # Ignorar errores no críticos que se gestionan por contrato del framework/Biblio
    # Permitir explícitos `_ =` en código
    - linters: [errcheck]
      text: 'Output\.JSON'
    - linters: [errcheck]
      text: 'Close\('
    - linters: [errcheck]
      text: 'Rollback\('
    - linters: [errcheck]
      text: 'ParseMultipartForm'
    - linters: [errcheck]
      text: 'WriteField'

errcheck:
  check-type-assertions: false
  check-blank: true

