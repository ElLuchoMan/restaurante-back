  /pedidos/asignar-pago:
    post:
      consumes:
      - application/json
      description: Asigna un pago existente a un pedido. Por defecto (`cambiar_estado=true`)
        marca además el pedido como TERMINADO y el pago como PAGADO (ambos cambios
        en una sola transacción); con `cambiar_estado=false` solo vincula el pago.
        Responde con el pedido completo actualizado. Si el pedido pasa a TERMINADO,
