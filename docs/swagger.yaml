        "400":
          description: pedido_id, pago_id o cambiar_estado inválidos
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: Token ausente o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "404":
          description: Pedido o pago no encontrado
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "409":
