            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: Token ausente o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "409":
          description: Conflicto de unicidad
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error al crear el producto
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - BearerAuth: []
      summary: Crear un nuevo producto
      tags:
      - productos
    put:
      consumes:
      - application/json
      - multipart/form-data
      description: 'Actualización parcial (merge): los campos ausentes se conservan
        (incluida `subcategoriaId`). `calorias`, `descripcion`, `imagen` y `subcategoriaId`
        admiten null explícito (se limpian); null en cualquier otro campo responde
        400. Un cuerpo sin cambios responde 200 con el producto actual (no 304). Si
        cambia `precio` se registra en el historial (misma transacción). Acepta JSON
        (`models.ProductoUpdateRequest`, imagen Base64) o `multipart/form-data` con
