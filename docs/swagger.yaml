        "400":
          description: JSON inválido, ids ausentes/no positivos o clienteId ausente
            para un trabajador
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: Token ausente o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "403":
          description: clienteId distinto del token o pedido de otro cliente
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "404":
          description: Cupón o pedido no encontrado
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "409":
          description: Cupón agotado, ya redimido o pedido cerrado
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "422":
          description: Cupón no aplicable
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error interno
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - BearerAuth: []
      summary: Redimir cupón
      tags:
      - cupones
