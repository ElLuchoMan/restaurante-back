  /pedidos:
    get:
      consumes:
      - application/json
      description: Devuelve pedidos filtrados por fecha, rango de fechas (`desde`
        y `hasta` solo se aplican juntos), mes/año, cliente, tipo de método de pago
        y si tienen domicilio. Todos los filtros son opcionales; un filtro con formato
        inválido responde 400. Sin resultados responde 200 con `data` igual a `[]`.
        En cada pedido `fechaPedido` va como DD-MM-YYYY, `horaPedido` como HH:MM:SS
        y las relaciones (`pagoId`, `domicilioId`, `restauranteId`, `documentoCliente`)
        como objetos en los que solo el id es fiable.
      parameters:
      - description: Fecha específica (YYYY-MM-DD)
        in: query
        name: fecha
        type: string
      - description: Fecha inicial del rango (YYYY-MM-DD); requiere `hasta`
        in: query
        name: desde
        type: string
      - description: Fecha final del rango (YYYY-MM-DD); requiere `desde`
        in: query
        name: hasta
        type: string
      - description: Mes del año (1-12)
        in: query
        name: mes
        type: integer
      - description: Año (YYYY); se combina con `mes` si ambos se envían
        in: query
        name: anio
        type: integer
      - description: Documento del cliente (entero positivo)
        in: query
        name: cliente
        type: integer
      - description: Tipo de método de pago (p. ej. NEQUI, DAVIPLATA, EFECTIVO); sin
          distinguir mayúsculas
        in: query
        name: metodo_pago
        type: string
      - description: 'true: solo pedidos con domicilio; false: solo pedidos sin domicilio'
        in: query
        name: domicilio
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Pedidos obtenidos (puede ser lista vacía)
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.PedidoDoc'
                  type: array
              type: object
        "400":
          description: Algún filtro tiene formato inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: Token ausente o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error al obtener los pedidos
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - BearerAuth: []
      summary: Obtener pedidos con múltiples filtros
      tags:
      - pedido
    post:
      consumes:
      - application/json
      description: 'Crea un pedido. El servidor fija `fechaPedido`/`horaPedido` (Bogotá)
        y `estadoPedido`=INICIADO. Todos los campos del cuerpo son opcionales: `delivery`
        (por defecto false; si es true exige `pk_id_domicilio`), `pk_id_domicilio`,
        `restauranteId` y `documentoCliente` (si se envían deben ser enteros positivos
        de filas existentes: 404 si no existen). Responde 201 con el pedido creado.
        Envía en segundo plano (best-effort, sin afectar la respuesta) un push de
        confirmación al cliente (si tiene `documentoCliente`) y un aviso a los trabajadores.'
      parameters:
      - description: Datos del pedido
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.PedidoCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Pedido creado
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.PedidoDoc'
              type: object
        "400":
          description: JSON inválido, ids no positivos o `delivery` sin domicilio
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: Token ausente o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "404":
          description: El domicilio, el restaurante o el cliente indicado no existe
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "409":
          description: Conflicto con datos existentes (p. ej. el domicilio ya pertenece
