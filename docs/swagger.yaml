info:
  contact:
    email: baluisto96@gmail.com
  description: API para gestionar el sistema de un restaurante para "El fogón de María"
  title: Restaurante API
  version: 2.0.0
paths:
  /cambios_horario:
    delete:
      consumes:
      - application/json
      description: Elimina un cambio de horario de la base de datos.
      parameters:
      - description: ID del cambio de horario
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Cambio de horario eliminado
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "404":
          description: Cambio de horario no encontrado
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error en la base de datos
          schema:
            $ref: '#/definitions/models.ApiResponse'
      summary: Eliminar un cambio de horario
      tags:
      - cambios_horario
    get:
      consumes:
      - application/json
      description: Obtiene un listado de todos los cambios de horario registrados
        en la base de datos
      produces:
      - application/json
      responses:
        "200":
          description: Listado de cambios de horario
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  items:
                    additionalProperties: true
                    type: object
                  type: array
              type: object
        "500":
          description: Error en la base de datos
          schema:
            $ref: '#/definitions/models.ApiResponse'
      summary: Obtener todos los cambios de horario
      tags:
      - cambios_horario
    post:
      consumes:
      - application/json
      description: Crea un nuevo cambio de horario en la base de datos.
      parameters:
      - description: Datos del cambio de horario (fecha YYYY-MM-DD, horas HH:MM:SS)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CambiosHorarioCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Cambio de horario creado
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: Error en la solicitud
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error en la base de datos
          schema:
            $ref: '#/definitions/models.ApiResponse'
      summary: Crear un nuevo cambio de horario
      tags:
      - cambios_horario
    put:
      consumes:
      - application/json
      description: Actualiza los datos de un cambio de horario existente.
      parameters:
      - description: ID del cambio de horario
        in: query
        name: id
        required: true
        type: integer
      - description: Datos del cambio de horario a actualizar (sólo campos a modificar)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CambiosHorarioUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Cambio de horario actualizado
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: Error en la solicitud
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "404":
          description: Cambio de horario no encontrado
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error en la base de datos
          schema:
            $ref: '#/definitions/models.ApiResponse'
      summary: Actualizar un cambio de horario
      tags:
      - cambios_horario
  /cambios_horario/actual:
    get:
      consumes:
      - application/json
      description: Obtiene el cambio de horario que aplica para la fecha actual, si
        existe.
      produces:
      - application/json
      responses:
        "200":
          description: No hay cambios de horario para la fecha actual
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error en la base de datos
          schema:
            $ref: '#/definitions/models.ApiResponse'
      summary: Consultar cambios de horario para la fecha actual
      tags:
      - cambios_horario
  /clientes:
    delete:
      consumes:
      - application/json
      description: Elimina un cliente de la base de datos.
      parameters:
      - description: ID del Cliente
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Cliente eliminado
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: No autorizado
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "404":
          description: Cliente no encontrado
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - BearerAuth: []
      summary: Eliminar un cliente
      tags:
      - clientes
    get:
      consumes:
      - application/json
      description: Devuelve todos los clientes registrados en la base de datos, con
        opción de retornar solo nombre completo y teléfono.
      parameters:
      - default: 10
        description: Cantidad de resultados por página
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Número de registros a omitir
        in: query
        minimum: 0
        name: offset
        type: integer
      - description: 'Campos a incluir en la respuesta (opciones: ''nombre_completo_telefono'')'
        in: query
        name: fields
