        inventario, todo en una transacción. Las líneas repetidas se suman y las de
        `cantidad` 0 se ignoran (debe quedar al menos una con `cantidad` > 0); `productoId`
        <= 0 o `cantidad` negativa responden 400. Responde 404 si el pedido o algún
        producto no existe, 409 si el inventario no alcanza (`data` lista {productoId,
        requerido, disponible}) o si el producto ya está en el pedido (use PUT para
        modificarlo).
      parameters:
      - description: Pedido y sus productos
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ProductoPedidoCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Productos agregados exitosamente
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.ProductoPedidoDoc'
              type: object
        "400":
          description: JSON inválido, pedidoId inválido, sin líneas válidas, productoId
            <= 0 o cantidad negativa
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: Token ausente o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "404":
          description: Pedido o producto no encontrado
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "409":
          description: Inventario insuficiente (con detalle en `data`) o producto
            ya presente en el pedido
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.InventarioInsuficienteDoc'
                  type: array
              type: object
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - BearerAuth: []
      summary: Agregar productos a un pedido
      tags:
      - producto_pedido
    put:
      consumes:
      - application/json
      description: 'Reemplaza las líneas del pedido por la lista enviada (el cuerpo
        es un arreglo, no un objeto, así que no aplica el merge por campos): los productos
        que no aparezcan se quitan y una línea con `cantidad` 0 también quita el producto.
        El inventario se ajusta con la diferencia (descuenta o devuelve) en una transacción.
        Las líneas repetidas se suman; `productoId` <= 0 o `cantidad` negativa responden
        400; la lista no puede estar vacía. Responde 404 si el pedido o algún producto
        a descontar no existe y 409 si el inventario no alcanza (`data` lista {productoId,
        requerido, disponible}).'
      parameters:
      - description: ID del pedido (entero positivo)
        in: query
        name: pedido_id
        required: true
        type: integer
      - description: Lista completa de productos que debe quedar en el pedido
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/models.ProductoPedidoItemInput'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: Productos actualizados exitosamente
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.ProductoPedidoDoc'
              type: object
        "400":
          description: pedido_id inválido, cuerpo que no es un arreglo, lista vacía,
            productoId <= 0 o cantidad negativa
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: Token ausente o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "404":
          description: Pedido o producto no encontrado
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "409":
          description: Inventario insuficiente (con detalle en `data`)
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.InventarioInsuficienteDoc'
                  type: array
              type: object
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - BearerAuth: []
      summary: Reemplazar los productos de un pedido
      tags:
      - producto_pedido
