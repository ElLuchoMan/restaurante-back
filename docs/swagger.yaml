        required: true
        type: integer
      - description: ID del pago (entero positivo)
        in: query
        name: pago_id
        required: true
        type: integer
      - default: true
        description: 'true (defecto): pedido TERMINADO y pago PAGADO; false: solo
          vincula el pago'
        in: query
        name: cambiar_estado
        type: boolean
      produces:
