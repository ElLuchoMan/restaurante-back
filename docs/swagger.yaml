  /descuentos/pedidos:
    get:
      consumes:
      - application/json
      description: Cualquier usuario autenticado. Un Cliente solo puede consultar
        descuentos de sus propios pedidos (403 si el pedido es de otro cliente); un
        trabajador o administrador puede consultar cualquiera. Lista los descuentos
        aplicados al pedido. Si el pedido existe pero no tiene descuentos, `data`
        es una lista vacía `[]`; si no existe responde 404.
      parameters:
      - description: ID del pedido (entero positivo)
        in: query
        name: pedido_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Descuentos del pedido (puede ser vacío)
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.PedidoDescuentoDoc'
                  type: array
              type: object
        "400":
          description: pedido_id inválido o ausente
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: Token ausente o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "403":
          description: El pedido es de otro cliente
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "404":
          description: Pedido no encontrado
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error en la base de datos
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - BearerAuth: []
      summary: Obtener descuentos de un pedido
      tags:
      - descuentos
    post:
      consumes:
      - application/json
      description: 'Cualquier usuario autenticado. Aplica un único descuento (cupón
        u oferta, exactamente uno) a un pedido y recalcula su total, todo en UNA transacción:
        el servidor valida (cupón: activo, vigencia, topes `maxUsos`/`limitePorCliente`
        bajo `SELECT ... FOR UPDATE`, monto mínimo, scope; oferta: activa, período,
        día, horario, restaurante y productos del pedido), CALCULA el monto con el
        detalle del pedido (el cliente nunca envía el monto), redime el cupón, registra
        el descuento y resta el monto del `monto` del pago del pedido (si tiene pago).
        Si algo falla no queda nada a medias. Un pedido admite un solo descuento y
        no debe estar cancelado, terminado ni pagado. El cliente SALE DEL TOKEN: un
        Cliente no envía `clienteId` (si lo envía y no coincide con su documento responde
        403); un trabajador o administrador actúa en nombre de un cliente y debe indicar
        `clienteId`. El pedido debe pertenecer a ese cliente (403 si es de otro, 404
        si no existe). `detalle` es opcional y debe ser un objeto JSON; se conserva
        y se le agregan los datos del cupón/oferta (`tipo`, `codigo`/`titulo`, `scope`),
        que prevalecen. La respuesta trae el descuento registrado y los importes:
        `subtotal` (suma del detalle), `montoDescuento` y `total` (lo que debe pagarse;
        si hay pago, es su nuevo `monto`, y `pagoId` lo identifica). Errores: 400
        (pedido_id/ids/JSON inválidos o `clienteId` ausente para un trabajador), 403,
        404 (pedido, cupón u oferta inexistente), 409 (el pedido ya tiene un descuento,
        ya está pagado, cancelado o terminado; cupón agotado, límite por cliente alcanzado
        o ya redimido en el pedido), 422 (no se indicó exactamente uno de cupón u
        oferta, detalle que no es objeto, cupón u oferta no aplicable).'
      parameters:
      - description: ID del pedido (entero positivo)
        in: query
        name: pedido_id
        required: true
        type: integer
      - description: 'Cupón u oferta a aplicar (sin monto: lo calcula el servidor)'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.AplicarDescuentoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Descuento aplicado y total recalculado
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.DescuentoAplicadoDoc'
              type: object
        "400":
          description: pedido_id, ids o JSON inválidos, o clienteId ausente para un
            trabajador
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: Token ausente o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "403":
          description: clienteId distinto del token o pedido de otro cliente
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "404":
          description: Pedido, cupón u oferta no encontrado
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "409":
          description: El pedido ya tiene descuento, ya está pagado/cerrado, o el
            cupón está agotado o ya redimido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "422":
          description: Solicitud inválida o cupón/oferta no aplicable
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error al aplicar el descuento
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - BearerAuth: []
      summary: Aplicar descuento a pedido
      tags:
      - descuentos
