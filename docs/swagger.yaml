          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error al crear el pedido
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - BearerAuth: []
      summary: Crear un nuevo pedido
      tags:
      - pedido
  /pedidos/actualizar-estado:
    put:
      consumes:
