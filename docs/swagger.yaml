        no envía `clienteId` (si lo envía y no coincide con su documento responde
        403); un trabajador o administrador actúa en nombre de un cliente y debe indicar
        `clienteId`. El pedido debe pertenecer a ese cliente (404 si no existe, 403
        si es de otro) y no estar cancelado ni terminado (409). Todo ocurre en una
        transacción que bloquea el pedido y la fila del cupón (`SELECT ... FOR UPDATE`)
        y vuelve a comprobar activo, vigencia, `maxUsos` y `limitePorCliente` bajo
        el bloqueo: dos redenciones simultáneas no pueden superar los topes. Un cupón
        no puede redimirse dos veces en el mismo pedido. Solo registra la redención;
        para aplicar el descuento al pedido y recalcular su total use POST /descuentos/pedidos.
        Errores: 400 (JSON inválido, `pedidoId` ausente o no positivo, `clienteId`
        ausente para un trabajador), 403, 404 (cupón o pedido inexistente), 409 (cupón
        agotado, límite por cliente alcanzado, ya redimido en el pedido o pedido cerrado),
        422 (cupón no aplicable: inactivo, fuera de vigencia, cliente no permitido,
        monto mínimo, sin productos aplicables). La respuesta es el registro de redención
        con montoDescuento.'
      parameters:
      - description: Código del cupón
        in: path
        name: codigo
        required: true
        type: string
      - description: Datos de redención (pedidoId obligatorio; clienteId solo para
          trabajadores)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.RedimirCuponRequest'
