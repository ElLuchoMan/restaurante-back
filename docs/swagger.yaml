paths:
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Permite obtener un nuevo access token utilizando un refresh token
        válido
      parameters:
      - description: 'Refresh Token en formato: Bearer {token}'
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Tokens renovados exitosamente
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.AuthResponse'
              type: object
        "400":
          description: Solicitud incorrecta
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: Refresh token inválido o expirado
          schema:
            $ref: '#/definitions/models.ApiResponse'
      summary: Renovar access token usando refresh token
      tags:
      - auth
  /cambios_horario:
