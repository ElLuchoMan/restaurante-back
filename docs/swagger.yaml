  /telemetria/dashboard:
    get:
      consumes:
      - application/json
      description: 'Obtiene métricas generales del dashboard usando datos existentes:
        total de pedidos, ingresos, usuarios, promedios y métricas del período seleccionado.'
      parameters:
      - default: ultimo_mes
        description: 'Período relativo a hoy: hoy; ultima_semana (últimos 7 días);
          ultimo_mes (último mes, valor por defecto); ultimos_3_meses; ultimos_6_meses;
          ultimo_año; historico (desde 1900-01-01); mes_año (sin mes/año equivale
          al mes en curso hasta hoy); rango_fechas (sin fecha_inicio/fecha_fin equivale
          al último mes). Cualquier otro valor se trata como ultimo_mes. Se ignora
          si se envía mes/año o fecha_inicio/fecha_fin (mes/año tiene prioridad sobre
          fecha_inicio/fecha_fin)'
        enum:
        - hoy
        - ultima_semana
        - ultimo_mes
        - ultimos_3_meses
        - ultimos_6_meses
        - ultimo_año
        - historico
        - mes_año
        - rango_fechas
        in: query
        name: periodo
        type: string
      - description: Mes (1-12) del filtro mes_año; se activa al enviar mes o año
          y requiere ambos (si falta uno se usa el mes en curso hasta hoy). Un valor
          fuera de 1-12 se toma como 1
        in: query
        maximum: 12
        minimum: 1
        name: mes
        type: integer
      - description: Año (1900-2100) del filtro mes_año; un valor fuera de rango se
          toma como el año en curso
        in: query
        maximum: 2100
        minimum: 1900
        name: año
        type: integer
      - description: Inicio del filtro rango_fechas (YYYY-MM-DD, inclusive); se activa
          al enviar fecha_inicio o fecha_fin y requiere ambas (si falta una se usa
          el último mes hasta hoy). Una fecha inválida se reemplaza por hace un mes
        format: date
        in: query
        name: fecha_inicio
        type: string
      - description: Fin del filtro rango_fechas (YYYY-MM-DD, inclusive). Una fecha
          inválida se reemplaza por hoy
        format: date
        in: query
        name: fecha_fin
        type: string
      - description: Hora mínima del día (HH:MM:SS o HH:MM) aplicada sobre cualquier
          período; por defecto 00:00:00 y un valor inválido se reemplaza por el defecto
        in: query
        name: hora_inicio
        type: string
      - description: Hora máxima del día (HH:MM:SS o HH:MM) aplicada sobre cualquier
          período; por defecto 23:59:59 y un valor inválido se reemplaza por el defecto
        in: query
        name: hora_fin
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Dashboard obtenido exitosamente
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.DashboardData'
              type: object
        "401":
          description: Token no proporcionado o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "403":
          description: Acceso denegado - se requiere rol de administrador
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - BearerAuth: []
      summary: Dashboard General de Telemetría
      tags:
      - telemetria
