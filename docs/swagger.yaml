        "500":
          description: Error en la base de datos
          schema:
            $ref: '#/definitions/models.ApiResponse'
      summary: Obtener productos con filtros
      tags:
      - productos
    post:
      consumes:
      - application/json
      - multipart/form-data
      description: Crea un producto y registra su precio inicial en el historial (ambas
        escrituras en una transacción). Acepta JSON (cuerpo `models.ProductoCreateRequest`,
        imagen en Base64, tolera prefijo `data:image/...;base64,`) o `multipart/form-data`
        con los mismos campos como texto y `imagen` como archivo. `nombre` obligatorio,
        `precio` > 0, `cantidad` >= 0, `estadoProducto` DISPONIBLE o NO_DISPONIBLE;
        `calorias`, `descripcion`, `imagen` y `subcategoriaId` son opcionales (sin
        subcategoría queda null). Respuesta 201 con el producto creado.
      parameters:
      - description: Datos del producto (JSON). En multipart, los mismos campos como
          form-data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ProductoCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Producto creado
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.ProductoDoc'
              type: object
        "400":
          description: JSON/form inválido, imagen Base64 inválida, validación o subcategoría
            inexistente
