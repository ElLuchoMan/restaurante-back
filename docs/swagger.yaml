info:
  contact:
    email: baluisto96@gmail.com
  description: API para gestionar el sistema de "El fogón de María"
  title: El fogón de María API
  version: 2.0.0
paths:
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 'Permite obtener un nuevo access token (y un nuevo refresh token)
        utilizando un refresh token válido enviado en el header Authorization (con
        o sin prefijo "Bearer "). Un access token no sirve como refresh token. Límite:
        30 peticiones por minuto y por IP (429 con cabecera Retry-After). `expires_in`
        son los segundos de vida del access token (7200 = 120 min) como string.'
      parameters:
      - description: 'Refresh Token en formato: Bearer {token}'
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Tokens renovados exitosamente
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.AuthResponse'
              type: object
        "400":
          description: Solicitud incorrecta
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: Refresh token inválido, expirado o no es un refresh token
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "429":
          description: Demasiadas solicitudes desde esta IP
          headers:
            Retry-After:
              description: Segundos de espera antes de reintentar
              type: integer
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error al generar los tokens
          schema:
            $ref: '#/definitions/models.ApiResponse'
      summary: Renovar access token usando refresh token
      tags:
      - auth
  /cambios_horario:
    delete:
      consumes:
      - application/json
      description: Elimina un cambio de horario. Si algún restaurante lo referencia
        responde 409. Requiere token.
      parameters:
      - description: ID del cambio de horario (entero positivo)
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Cambio de horario eliminado
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "400":
          description: ID inválido o ausente
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: Token ausente o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "404":
          description: Cambio de horario no encontrado
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "409":
          description: El cambio de horario está en uso
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error en la base de datos
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - BearerAuth: []
      summary: Eliminar un cambio de horario
      tags:
      - cambios_horario
    get:
      consumes:
      - application/json
      description: 'Devuelve todos los cambios de horario ordenados por fecha (fechas
        DD-MM-YYYY, horas HH:MM:SS). Sin resultados responde 200 con `data: []`. Requiere
        token.'
      produces:
      - application/json
      responses:
        "200":
          description: Listado de cambios de horario (puede ser vacío)
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.CambiosHorarioResponse'
                  type: array
              type: object
        "401":
          description: Token ausente o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error en la base de datos
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - BearerAuth: []
      summary: Listar cambios de horario
      tags:
      - cambios_horario
    post:
      consumes:
      - application/json
      description: 'Crea un cambio de horario. Obligatorios: fechaCambioHorario (YYYY-MM-DD)
        y abierto. Si abierto=true, horaApertura y horaCierre (HH:MM o HH:MM:SS) son
        obligatorias; si abierto=false se ignoran y se fijan 00:00:00 - 23:59:59.
        Requiere token.'
      parameters:
      - description: Datos del cambio de horario
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CambiosHorarioCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Cambio de horario creado
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.CambiosHorarioResponse'
              type: object
        "400":
          description: Solicitud inválida (JSON, campos obligatorios, fecha u hora)
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: Token ausente o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "409":
          description: Ya existe un cambio de horario para esa fecha
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error en la base de datos
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - BearerAuth: []
      summary: Crear un cambio de horario
      tags:
      - cambios_horario
    put:
      consumes:
      - application/json
      description: 'Actualización parcial con merge: los campos ausentes se CONSERVAN
        y null en cualquiera responde 400 (no hay campos anulables). Si el resultado
        es abierto=false las horas se fuerzan a 00:00:00 - 23:59:59. Si pasa de cerrado
        a abierto, horaApertura y horaCierre son obligatorias en la petición. Requiere
        token.'
      parameters:
      - description: ID del cambio de horario (entero positivo)
        in: query
        name: id
        required: true
        type: integer
      - description: Campos a modificar (todos opcionales)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CambiosHorarioUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Cambio de horario actualizado
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.CambiosHorarioResponse'
              type: object
        "400":
          description: Solicitud inválida (id, JSON, null, fecha u hora)
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: Token ausente o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "404":
          description: Cambio de horario no encontrado
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "409":
          description: Ya existe un cambio de horario para esa fecha
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error en la base de datos
          schema:
