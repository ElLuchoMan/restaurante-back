        type: string
      - description: Hora mínima del día (HH:MM:SS o HH:MM) aplicada sobre cualquier
          período; por defecto 00:00:00 y un valor inválido se reemplaza por el defecto
        in: query
        name: hora_inicio
        type: string
      - description: Hora máxima del día (HH:MM:SS o HH:MM) aplicada sobre cualquier
          período; por defecto 23:59:59 y un valor inválido se reemplaza por el defecto
        in: query
        name: hora_fin
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Análisis de usuarios obtenido exitosamente
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.UsersData'
              type: object
        "401":
          description: Token no proporcionado o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "403":
          description: Acceso denegado - se requiere rol de administrador
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - BearerAuth: []
      summary: Análisis de Usuarios
      tags:
      - telemetria
  /trabajadores:
    delete:
      consumes:
      - application/json
      description: 'Baja lógica: no borra el registro, fija `fechaRetiro` a la fecha
        actual (UTC) y el trabajador deja de aparecer en el listado por defecto. Si
        ya estaba retirado responde 409 para no sobrescribir su fecha de retiro (use
        PUT con fechaRetiro para corregirla). Devuelve el trabajador actualizado (fechas
        DD-MM-YYYY, sin contraseña). Requiere rol Administrador.'
      parameters:
      - description: Documento del trabajador (entero positivo)
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Trabajador retirado
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.TrabajadorResponse'
              type: object
        "400":
          description: Parámetro 'id' inválido o ausente
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: Token ausente o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "403":
          description: El usuario no es administrador
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "404":
          description: Trabajador no encontrado
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "409":
          description: El trabajador ya estaba retirado
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error en la base de datos
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - BearerAuth: []
      summary: Retirar un trabajador (solo administrador)
      tags:
      - trabajadores
    get:
      consumes:
      - application/json
      description: 'Devuelve los trabajadores (nunca incluye la contraseña), cada
        uno con su lista `horarios` (`[]` si no tiene). Por defecto excluye a los
        retirados. Las fechas se devuelven en formato DD-MM-YYYY; el filtro `fecha_ingreso`
        se envía en YYYY-MM-DD. Si no hay coincidencias responde 200 con `data: []`.
        Requiere token de un usuario con rol Administrador.'
      parameters:
      - description: Filtrar por fecha exacta de ingreso (YYYY-MM-DD). También se
          acepta el alias fechaIngreso
        in: query
        name: fecha_ingreso
        type: string
      - description: Filtrar por rol
        enum:
        - Administrador
        - Mesero
        - Cocinero
        - Domiciliario
        - Oficios_varios
        in: query
        name: rol
        type: string
      - default: false
        description: Incluir trabajadores retirados (true/false)
        in: query
        name: incluir_retirados
        type: boolean
      - default: false
        description: Ver solo trabajadores retirados (true/false); tiene prioridad
          sobre incluir_retirados
        in: query
        name: solo_retirados
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Lista de trabajadores (puede ser vacía)
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.TrabajadorResponse'
                  type: array
              type: object
        "400":
          description: Parámetro inválido (fecha, rol o booleano)
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: Token ausente o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "403":
          description: El usuario no es administrador
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error en la base de datos
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - BearerAuth: []
      summary: Listar trabajadores (solo administrador)
      tags:
      - trabajadores
    post:
      consumes:
      - application/json
      description: 'Crea un trabajador. Solo un administrador puede hacerlo (y por
        tanto crear otro administrador). Obligatorios: documentoTrabajador, nombre,
        apellido, rol, fechaIngreso (YYYY-MM-DD), sueldo (>= 0) y password (máx. 72
        bytes). Opcionales: nuevo (booleano; si se omite queda en false), telefono
        (cadena vacía equivale a no informado), restauranteId y fechaNacimiento (YYYY-MM-DD).
        La respuesta (fechas en DD-MM-YYYY) nunca incluye la contraseña y trae `horarios:
        []`.'
      parameters:
      - description: Datos del trabajador a crear (fechas YYYY-MM-DD)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.TrabajadorCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Trabajador creado
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.TrabajadorResponse'
              type: object
        "400":
          description: Solicitud inválida (JSON, campos obligatorios, rol, fechas,
            password o restauranteId inexistente)
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: Token ausente o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "403":
          description: El usuario no es administrador
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "409":
          description: Ya existe un trabajador con ese documento o teléfono
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error en la base de datos
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - BearerAuth: []
      summary: Crear un trabajador (solo administrador)
      tags:
      - trabajadores
    put:
      consumes:
      - application/json
      description: 'Actualización parcial con merge: los campos ausentes se CONSERVAN.
        Un campo anulable enviado como null se limpia (telefono, fechaNacimiento,
        fechaRetiro y restauranteId); null en cualquier otro campo responde 400, igual
        que las cadenas vacías en nombre, apellido o password. Fechas en YYYY-MM-DD
        en la petición y DD-MM-YYYY en la respuesta. Una `password` nueva se guarda
        hasheada y nunca se devuelve. Un teléfono vacío equivale a null. Requiere
        rol Administrador (un no administrador no puede modificar roles).'
      parameters:
      - description: Documento del trabajador (entero positivo)
        in: query
        name: id
        required: true
        type: integer
      - description: Campos a modificar (todos opcionales)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.TrabajadorUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Trabajador actualizado
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.TrabajadorResponse'
              type: object
        "400":
          description: Solicitud inválida (id, JSON, null en campo no anulable, rol,
            fechas, password, restauranteId inexistente)
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: Token ausente o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "403":
          description: El usuario no es administrador
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "404":
          description: Trabajador no encontrado
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "409":
          description: El teléfono ya está registrado por otro trabajador
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error en la base de datos
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - BearerAuth: []
      summary: Actualizar un trabajador (solo administrador)
      tags:
      - trabajadores
  /trabajadores/search:
    get:
      consumes:
      - application/json
      description: Devuelve un trabajador (incluso retirado) por su documento, con
        su lista `horarios`. Nunca incluye la contraseña. Fechas en DD-MM-YYYY. Requiere
        rol Administrador.
      parameters:
      - description: Documento del trabajador (entero positivo)
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Trabajador encontrado
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.TrabajadorResponse'
              type: object
        "400":
          description: Parámetro 'id' inválido o ausente
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "401":
          description: Token ausente o inválido
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "403":
          description: El usuario no es administrador
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "404":
          description: Trabajador no encontrado
          schema:
            $ref: '#/definitions/models.ApiResponse'
        "500":
          description: Error en la base de datos
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - BearerAuth: []
      summary: Obtener trabajador por documento (solo administrador)
      tags:
      - trabajadores
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
