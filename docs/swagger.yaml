  /cupones/validar:
    post:
      consumes:
      - application/json
      description: 'Cualquier usuario autenticado. Evalúa si un cupón es aplicable
        a un cliente. El cliente SALE DEL TOKEN: un Cliente no envía `clienteId` (si
        lo envía y no coincide con su documento responde 403); un trabajador o administrador
        actúa en nombre de un cliente y debe indicar `clienteId`. Con `pedidoId` el
        servidor evalúa el detalle real del pedido (que debe pertenecer al cliente:
        404 si no existe, 403 si es de otro) e ignora `items`; sin `pedidoId`, `items`
        es obligatorio (`productoId` > 0, `cantidad` >= 1, `precio` >= 0) y el resultado
        es solo una vista previa no vinculante. Responde 200 con `aplicable` true/false:
        si es false, `motivo` explica por qué (cupón inexistente, inactivo, fuera
        de vigencia, usos agotados, cliente no permitido, monto mínimo o sin productos
        aplicables).'
      parameters:
      - description: Datos para validación
        in: body
        name: body
        required: true
        schema:
