codecov:
  require_ci_to_pass: yes

coverage:
  precision: 1
  round: down
  range: "60...100"

  status:
    project:
      default:
        target: 68%
        threshold: 1%
        if_ci_failed: error

    patch:
      default:
        target: 60%
        threshold: 5%

ignore:
  - "docs/docs.go"              # Archivo generado por Swagger
  - "**/*_test.go"              # Archivos de test
  - "**/test_*.go"              # Archivos de test
  - "tests/**"                  # Directorio de tests
  - "tools/**"                  # Scripts y herramientas
  - "swagger/**"                # Documentación Swagger

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: no
  require_base: no
  require_head: yes

github_checks:
  annotations: true
