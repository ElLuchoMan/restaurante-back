# Configuración de Codecov para restaurante-back
codecov:
  require_ci_to_pass: yes

coverage:
  precision: 1
  round: down
  range: "60...100"

  status:
    project:
      default:
        target: auto
        threshold: 2%
        if_ci_failed: error

    patch:
      default:
        target: auto
        threshold: 5%

# Ignorar archivos de infraestructura y código generado
ignore:
  - "docs/docs.go"  # Archivo generado por Swagger (>11k líneas)
  - "controllers/**/Controller_defaults.go"  # Archivos triviales de build tags para producción
  - "controllers/**/*_defaults.go"  # Patrón alternativo por si acaso

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: no
  require_base: no
  require_head: yes

github_checks:
  annotations: true
